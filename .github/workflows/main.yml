name: Render video
on: 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: 18
      
      # 给云端服务器安装中文字体，解决方块字问题
      - name: Install Chinese Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      
      - run: npm i
      
      # 开启4个线程疯狂渲染，速度比之前快好几倍！
      - run: npx remotion render HelloWorld out/video.mp4 --concurrency=4
      
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
